<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Conductor{% endblock %}</title>

    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              ink: "#0a111f",
              prussian: "#14213d",
              orange: "#fca311",
              apricot: "#f1c47b",
              alabaster: "#e5e5e5",
              green: "#09c11c",
            },
            fontFamily: {
              display: ['"Space Grotesk"', "sans-serif"],
              body: ['"Inter"', "sans-serif"],
              mono: ['"JetBrains Mono"', "monospace"],
            },
          },
        },
      };
    </script>

    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />

    <style>
      /* Theme-aware base styles that Tailwind's CDN build can't express via dark: alone for body defaults */
      html.dark {
        --bg-effect-color: #fca311;
      }
      html:not(.dark) {
        --bg-effect-color: #14213d;
      }
      html.dark body {
        background-color: #0a111f;
        color: #e5e5e5;
      }
      html:not(.dark) body {
        background-color: #ffffff;
        color: #14213d;
      }

      /* Pulse dot for "system operational" indicator */
      @keyframes pulse-ring {
        0% {
          transform: scale(0.8);
          opacity: 0.8;
        }
        70% {
          transform: scale(1.8);
          opacity: 0;
        }
        100% {
          transform: scale(0.8);
          opacity: 0;
        }
      }
      .pulse-dot::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background-color: #3cdc4c;
        animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Scrollbar styling for cert/result lists */
      .thin-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .thin-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .thin-scroll::-webkit-scrollbar-thumb {
        background-color: #fca311;
        border-radius: 3px;
        opacity: 0.5;
      }

      /*
        Sidebar collapse convention:
        - Elements with class .sidebar-text are hidden when sidebar is collapsed
        - The sidebar width toggles between w-60 (240px) and 4rem (64px, icon-only)
        - State is driven by the data-collapsed attribute on <aside id="sidebar">
        - Persisted in localStorage under key "sidebar-collapsed"
      */
    </style>

    {% block head_extra %}{% endblock %}
  </head>
  <body class="font-body min-h-screen flex bg-pattern-constellations">
    <!-- Sidebar -->
    <aside
      id="sidebar"
      data-collapsed="false"
      class="w-60 shrink-0 h-screen sticky top-0 flex flex-col justify-between border-r border-prussian/20 dark:border-alabaster/10 bg-white dark:bg-ink overflow-hidden transition-all duration-300"
      style="position: sticky; z-index: 1"
    >
      <div>
        <!-- Branding -->
        <div
          class="px-5 py-6 flex items-center gap-2 border-b border-prussian/10 dark:border-alabaster/10"
        >
          <a href="/" class="flex items-center gap-2 flex-1 min-w-0">
            <img src="/static/favicon.svg" alt="" class="w-6 h-6 shrink-0" />
            <span
              id="brand-text"
              class="sidebar-text font-display font-semibold text-lg tracking-tight text-prussian dark:text-white truncate"
            >
              Conductor
            </span>
          </a>
        </div>

        <!-- Nav -->
        <nav class="px-3 py-4 flex flex-col gap-1 text-sm font-medium">
          <a
            href="/"
            class="flex items-center gap-2 px-3 py-2 rounded-md {% if request.path == '/' %} bg-orange text-ink font-semibold shadow-sm {% else %} text-prussian/60 dark:text-alabaster/60 hover:bg-prussian/10 dark:hover:bg-white/10 hover:translate-x-0.5 transition-all duration-200 {% endif %}"
            title="Dashboard"
          >
            <svg
              class="w-4 h-4 shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            <span class="sidebar-text">Dashboard</span>
          </a>
          <a
            href="/scan"
            class="flex items-center gap-2 px-3 py-2 rounded-md {% if request.path == '/scan' %} bg-orange text-ink font-semibold shadow-sm {% else %} text-prussian/60 dark:text-alabaster/60 hover:bg-prussian/10 dark:hover:bg-white/10 hover:translate-x-0.5 transition-all duration-200 {% endif %}"
            title="New Scan"
          >
            <svg
              class="w-4 h-4 shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M12 2l1.5 8.5L22 12l-8.5 1.5L12 22l-1.5-8.5L2 12l8.5-1.5L12 2z"
              />
            </svg>
            <span class="sidebar-text">New Scan</span>
          </a>
          <a
            href="/history"
            class="flex items-center gap-2 px-3 py-2 rounded-md {% if request.path.startswith('/history') %} bg-orange text-ink font-semibold shadow-sm {% else %} text-prussian/60 dark:text-alabaster/60 hover:bg-prussian/10 dark:hover:bg-white/10 hover:translate-x-0.5 transition-all duration-200 {% endif %}"
            title="History"
          >
            <svg
              class="w-4 h-4 shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M4 19.5A2.5 2.5 0 016.5 17H20" />
              <path
                d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"
              />
              <line x1="8" y1="7" x2="16" y2="7" />
              <line x1="8" y1="11" x2="14" y2="11" />
            </svg>
            <span class="sidebar-text">History</span>
          </a>
        </nav>
      </div>

      <!-- Footer: status + toggle + theme -->
      <div
        class="px-4 py-4 border-t border-prussian/10 dark:border-alabaster/10 flex flex-col gap-3"
      >
        <div
          class="flex items-center gap-2 text-xs font-mono text-prussian/60 dark:text-alabaster/60"
        >
          <span class="sidebar-text relative inline-flex w-2 h-2 shrink-0">
            <span class="pulse-dot absolute inset-0"></span>
            <span class="relative w-2 h-2 rounded-full bg-green"></span>
          </span>
          <span class="sidebar-text">System Operational</span>
        </div>

        <button
          id="sidebar-toggle"
          class="shrink-0 w-full h-8 flex items-center justify-center gap-2 rounded-md text-xs font-medium border border-prussian/15 dark:border-alabaster/15 text-prussian/50 dark:text-alabaster/50 hover:bg-prussian/5 dark:hover:bg-white/5 transition-colors"
          title="Toggle sidebar"
        >
          <svg
            id="toggle-icon"
            class="w-4 h-4 transition-transform duration-300"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M15 19l-7-7 7-7" />
          </svg>
          <span class="sidebar-text">Collapse</span>
        </button>

        <button
          id="theme-toggle"
          class="flex items-center justify-center gap-2 px-3 py-2 rounded-md text-xs font-medium border border-prussian/15 dark:border-alabaster/15 text-prussian/70 dark:text-alabaster/70 hover:bg-prussian/5 dark:hover:bg-white/5 transition-colors"
        >
          <span id="theme-icon">🌙</span>
          <span id="theme-label" class="sidebar-text">Dark mode</span>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main
      class="flex-1 px-6 sm:px-10 py-8 max-w-5xl mx-auto w-full"
      style="position: relative; z-index: 1"
    >
      {% block content %}{% endblock %}
    </main>

    <script>
      // Theme persistence — checks localStorage first, falls back to dark
      const root = document.documentElement;
      const toggleBtn = document.getElementById("theme-toggle");
      const icon = document.getElementById("theme-icon");
      const label = document.getElementById("theme-label");

      function applyTheme(theme) {
        if (theme === "light") {
          root.classList.remove("dark");
          icon.textContent = "☀️";
          label.textContent = "Light mode";
        } else {
          root.classList.add("dark");
          icon.textContent = "🌙";
          label.textContent = "Dark mode";
        }
      }

      const saved = localStorage.getItem("conductor-theme") || "dark";
      applyTheme(saved);

      toggleBtn.addEventListener("click", () => {
        const isDark = root.classList.contains("dark");
        const next = isDark ? "light" : "dark";
        localStorage.setItem("conductor-theme", next);
        applyTheme(next);
      });
    </script>

    <script>
      (function () {
        if (document.getElementById("constellations-canvas")) return;
        const canvas = document.createElement("canvas");
        canvas.id = "constellations-canvas";
        canvas.style.cssText =
          "position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;";
        canvas.setAttribute("aria-hidden", "true");
        document.body.prepend(canvas);
        const ctx = canvas.getContext("2d");
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        let W, H;
        const STAR_COUNT = 50;
        const CONNECT_DIST = 120;
        let stars = [];

        function resize() {
          W = window.innerWidth;
          H = window.innerHeight;
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          if (stars.length === 0) initStars();
        }

        function initStars() {
          stars = [];
          for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
              x: Math.random() * W,
              y: Math.random() * H,
              vx: (Math.random() - 0.5) * 0.15,
              vy: (Math.random() - 0.5) * 0.15,
              r: 0.8 + Math.random() * 0.8,
              phase: Math.random() * Math.PI * 2,
            });
          }
        }

        resize();
        const _onResize = () => {
          resize();
          initStars();
        };
        window.addEventListener("resize", _onResize);

        function getColor() {
          const s = getComputedStyle(document.documentElement);
          return (
            s.getPropertyValue("--bg-effect-color").trim() ||
            s.getPropertyValue("--fg").trim() ||
            "#fca311"
          );
        }

        let t = 0;
        function draw() {
          if (!document.body.classList.contains("bg-pattern-constellations")) {
            window.removeEventListener("resize", _onResize);
            canvas.remove();
            return;
          }
          requestAnimationFrame(draw);
          t += 0.01;
          ctx.clearRect(0, 0, W, H);
          const c = getColor();

          for (const s of stars) {
            s.x += s.vx;
            s.y += s.vy;
            if (s.x < 0) s.x = W;
            if (s.x > W) s.x = 0;
            if (s.y < 0) s.y = H;
            if (s.y > H) s.y = 0;
          }

          ctx.strokeStyle = c;
          ctx.lineWidth = 0.5;
          for (let i = 0; i < stars.length; i++) {
            for (let j = i + 1; j < stars.length; j++) {
              const dx = stars[i].x - stars[j].x;
              const dy = stars[i].y - stars[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < CONNECT_DIST) {
                ctx.globalAlpha = (1 - dist / CONNECT_DIST) * 0.6;
                ctx.beginPath();
                ctx.moveTo(stars[i].x, stars[i].y);
                ctx.lineTo(stars[j].x, stars[j].y);
                ctx.stroke();
              }
            }
          }

          ctx.fillStyle = c;
          for (const s of stars) {
            const twinkle = 0.5 + 0.5 * Math.sin(t * 2 + s.phase);
            ctx.globalAlpha = 0.4 + twinkle * 0.5;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
        draw();
      })();
    </script>

    <!-- Toast container (positioned before block scripts so children can call showToast) -->
    <div
      id="toast-container"
      class="fixed top-4 left-1/2 -translate-x-1/2 flex flex-col gap-2 z-50 items-center"
    ></div>

    <script>
      function showToast(message, type = "success") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");

        const colors = {
          success: "bg-orange text-ink",
          error: "bg-prussian text-white border border-orange/40",
          info: "bg-prussian/90 dark:bg-alabaster/10 text-white dark:text-alabaster border border-prussian/20 dark:border-alabaster/20",
        };

        toast.className = `px-4 py-2 rounded-md text-sm font-medium shadow-lg ${colors[type] || colors.info} transition-all duration-300 transform -translate-y-2 opacity-0`;
        toast.textContent = message;

        container.appendChild(toast);

        requestAnimationFrame(() => {
          toast.classList.remove("translate-y-2", "opacity-0");
        });

        setTimeout(() => {
          toast.classList.add("opacity-0", "translate-y-2");
          setTimeout(() => toast.remove(), 300);
        }, 2500);
      }

      function copyToClipboard(text) {
        navigator.clipboard
          .writeText(text)
          .then(() => {
            showToast(`Copied: ${text}`, "success");
          })
          .catch(() => {
            showToast("Copy failed", "error");
          });
      }

      // Sidebar toggle — collapses to icon-only mode (64px) vs full (240px)
      const sidebar = document.getElementById("sidebar");
      const sidebarToggle = document.getElementById("sidebar-toggle");
      const toggleIcon = document.getElementById("toggle-icon");

      function setSidebarCollapsed(collapsed) {
        if (collapsed) {
          sidebar.style.width = "4rem";
          sidebar.dataset.collapsed = "true";
          toggleIcon.style.transform = "rotate(180deg)";
          localStorage.setItem("sidebar-collapsed", "true");
        } else {
          sidebar.style.width = "";
          sidebar.dataset.collapsed = "false";
          toggleIcon.style.transform = "";
          localStorage.setItem("sidebar-collapsed", "false");
        }
        document.querySelectorAll(".sidebar-text").forEach((el) => {
          el.classList.toggle("hidden", collapsed);
        });
      }

      sidebarToggle.addEventListener("click", () => {
        const isCollapsed = sidebar.dataset.collapsed === "true";
        setSidebarCollapsed(!isCollapsed);
      });

      if (localStorage.getItem("sidebar-collapsed") === "true") {
        setSidebarCollapsed(true);
      }
    </script>

    {% block scripts %}{% endblock %}
  </body>
</html>
